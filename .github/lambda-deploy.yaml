
name: "Deploy AWS Lambda"

on: 
  push:
    branches:
      - main
    paths:
      - "Lambda/"

jobs:
  deploy-lambda: # this job will update our lambda function on aws when changed on repo
    runs-on: "ubuntu-latest" # Job runs on latest ubuntu
    steps:
      - name: Checkouts repo
        uses: actions/checkout@v2

      - name: Setup Python Enviornment # Setups our python env
        uses: actions/setup-python@v2
        with:
          python-version: "3.14"
      
      - name: Install Dependencies # Installs any packages
        run: |
          python -m pip install --upgrade pip
          pip install -r lambda/requirements.txt -t lambda/requirements.txt

      - name: Configure AWS Creds # Sets up our AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-access-secret-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: us-east-1

      - name: Deploy Lambda Function # Zips Lambda directory and updates lambda function
        run: |
          cd lambda
          zip -r lambda.zip .
          aws lambda update-function-code --function-name my-test-cicd-lambda --zip-file  fileb://lambda.zip
